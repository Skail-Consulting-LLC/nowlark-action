name: Self-test
on: workflow_dispatch
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: Skail-Consulting-LLC/nowlark-action@v1
        with:
          api-key: ${{ secrets.NOWLARK_API_KEY }}
          title: Self-test notification from ${{ github.repository }}
  ask:
    runs-on: ubuntu-latest
    steps:
      - id: q
        uses: Skail-Consulting-LLC/nowlark-action@v1
        with:
          api-key: ${{ secrets.NOWLARK_API_KEY }}
          title: Self-test question from ${{ github.repository }}
          ask: approve_deny
          pass-on: approve
          wait: 300
      - run: test "${{ steps.q.outputs.answer }}" = approve
